name = "facilitador-bsv-x402-accesible"
main = "src/facilitator/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat_v2"]

[observability]
enabled = true

# KV Namespace for AI metadata caching
[[kv_namespaces]]
binding = "METADATA_CACHE"
id = "5f8ad74b43c048538ac0a22ef165184d"

# KV Namespace for user accessibility preferences (V2)
[[kv_namespaces]]
binding = "USER_PREFERENCES"
id = "5b534423fea04800b9580ba0464dc208"

# Development configuration (testnet para desarrollo)
[env.development]
name = "facilitador-bsv-x402-accesible-dev"

[env.development.vars]
WALLET_ADDRESS = "mhSDV8SPswwXCGFpkE8pTWUftVnSW6g3qk"
NETWORK = "testnet"
# V1 AI Configuration - start with low rollout
AI_ENABLED = "true"
AI_ROLLOUT_PERCENTAGE = "20"
OPENAI_MODEL_DEFAULT = "gpt-4o-mini"
OPENAI_MODEL_COMPLEX = "gpt-4o-mini"
CACHE_TTL_GENERIC = "604800"   # 7 days in seconds
CACHE_TTL_SPECIFIC = "86400"   # 24 hours in seconds
# V2 AI Configuration
OPENAI_MODEL_SIMPLE = "gpt-3.5-turbo"
OPENAI_MODEL_EXPERT = "gpt-4o"
USER_PREFERENCES_TTL = "2592000"   # 30 days in seconds
# V2 Feature Flags
WCAG_COMPLIANCE_ENABLED = "true"
MULTILANG_ENABLED = "true"          # AI-powered unlimited language support
FORMAT_CONVERSION_ENABLED = "true"   # XML, HTML, Markdown, Plain Text, JSON-LD
ADAPTIVE_COMPLEXITY_ENABLED = "false" # Experimental - postponed to V2.1
READING_LEVEL_ANALYSIS = "true"      # Flesch-Kincaid + WCAG compliance
# V3 Universal Accessibility - Development (start disabled)
ACCESSIBILITY_V3_ENABLED = "false"   # V3 endpoints: /v3/verify, /v3/settle
V3_ROLLOUT_PERCENTAGE = "0"          # Gradual rollout 0-100%
# V3 Mejoras Críticas - Feature Flags
FEATURE_STEP_BY_STEP_V2 = "true"         # Prioridad Crítica #1: stepByStep con timestamps
FEATURE_CHECKPOINTS = "true"             # Prioridad Crítica #2: Checkpoints de comprensión
FEATURE_STABLE_GLOSSARY = "true"         # Prioridad Crítica #3: Glosario estable (4 términos base)

[[env.development.kv_namespaces]]
binding = "METADATA_CACHE"
id = "55a8c9286a624d44ae6a8d8a7ab6df31"

[[env.development.kv_namespaces]]
binding = "USER_PREFERENCES"
id = "d988b944e2514fa1831299920c7e7621"

# Production configuration (mainnet por defecto)
[env.production]
name = "facilitador-bsv-x402-accesible"

[env.production.vars]
WALLET_ADDRESS = "1LiSSPcm8tLjCDPqQxCR5oPqvTUkYCpJ86"
NETWORK = "mainnet"
# V1 AI Configuration - gradual rollout (20 -> 50 -> 100)
AI_ENABLED = "true"
AI_ROLLOUT_PERCENTAGE = "100"
OPENAI_MODEL_DEFAULT = "gpt-3.5-turbo"
OPENAI_MODEL_COMPLEX = "gpt-4o-mini"
CACHE_TTL_GENERIC = "604800"   # 7 days in seconds
CACHE_TTL_SPECIFIC = "86400"   # 24 hours in seconds
# V2 AI Configuration
OPENAI_MODEL_SIMPLE = "gpt-3.5-turbo"
OPENAI_MODEL_EXPERT = "gpt-4o"
USER_PREFERENCES_TTL = "2592000"   # 30 days in seconds
# V2 Feature Flags
WCAG_COMPLIANCE_ENABLED = "true"
MULTILANG_ENABLED = "true"          # AI-powered unlimited language support
FORMAT_CONVERSION_ENABLED = "true"   # XML, HTML, Markdown, Plain Text, JSON-LD
ADAPTIVE_COMPLEXITY_ENABLED = "false" # Experimental - postponed to V2.1
READING_LEVEL_ANALYSIS = "true"      # Flesch-Kincaid + WCAG compliance
# V3 Universal Accessibility - Production (gradual rollout)
ACCESSIBILITY_V3_ENABLED = "true"    # V3 endpoints: /v3/verify, /v3/settle
V3_ROLLOUT_PERCENTAGE = "100"        # Start at 100% for production (fully enabled)
# V3 Mejoras Críticas - Feature Flags (Activadas en producción)
FEATURE_STEP_BY_STEP_V2 = "true"         # Prioridad Crítica #1: stepByStep con timestamps
FEATURE_CHECKPOINTS = "true"             # Prioridad Crítica #2: Checkpoints de comprensión
FEATURE_STABLE_GLOSSARY = "true"         # Prioridad Crítica #3: Glosario estable (4 términos base)

[[env.production.kv_namespaces]]
binding = "METADATA_CACHE"
id = "5f8ad74b43c048538ac0a22ef165184d"

[[env.production.kv_namespaces]]
binding = "USER_PREFERENCES"
id = "5b534423fea04800b9580ba0464dc208"
